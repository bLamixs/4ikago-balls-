# /etc/nginx/sites-available/lab1.conf
#
# Лаба 1: nginx как HTTPS reverse proxy, балансировщик и сервер статики.
#
# Ожидаемая структура:
# /opt/notes-lab/
# ├── frontend/
# ├── docs/
# ├── admin/
# ├── other-site/
# └── nginx/errors/

# Zone должна объявляться в http{}-контексте. В Ubuntu/Debian файлы из
# sites-enabled подключаются внутри http{}, поэтому директива допустима здесь.
#
# rate=5r/s: 5 запросов в секунду от одного IP.
# burst=2 nodelay в location /api/: 2 запроса допускаются сверх лимита,
# затем nginx сразу отвечает 429.
limit_req_zone $binary_remote_addr zone=notes_api_rate:10m rate=5r/s;

# Два Flask-инстанса. При одной неуспешной попытке сервер считается
# недоступным на 15 секунд и запрос может быть направлен второму.
upstream notes_backend_pool {
    # Стандартный алгоритм nginx: round-robin.
    server 127.0.0.1:5001 max_fails=1 fail_timeout=15s;
    server 127.0.0.1:5002 max_fails=1 fail_timeout=15s;

    keepalive 16;
}

# Локальный HTTPS-сертификат используется и для notes.local, и для second.local.
# Для реального окружения необходим сертификат, выданный доверенным CA.
map $http_host $lab1_allowed_host {
    default 0;
    "notes.local" 1;
    "notes.local:443" 1;
    "second.local" 1;
    "second.local:443" 1;
}

# -----------------------------
# 1) Catch-all HTTP virtual host
# -----------------------------
# Не обслуживает неизвестные Host и не позволяет им попасть на notes.local.
server {
    listen 80 default_server;
    server_name _;

    return 444;
}

# ------------------------------------
# 2) HTTP → HTTPS для notes.local
# ------------------------------------
server {
    listen 80;
    server_name notes.local;

    return 301 https://notes.local$request_uri;
}

# ------------------------------------
# 3) HTTP → HTTPS для second.local
# ------------------------------------
server {
    listen 80;
    server_name second.local;

    return 301 https://second.local$request_uri;
}

# ------------------------------------
# 4) Catch-all HTTPS virtual host
# ------------------------------------
# default_server гарантирует, что неизвестный Host не получит контент notes.local
# или second.local. Соединение TLS завершается на локальном сертификате,
# затем nginx возвращает 444 без тела.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/lab1-certs/notes.local.crt;
    ssl_certificate_key /etc/nginx/lab1-certs/notes.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# ------------------------------------
# 5) Основной виртуальный хост Notes
# ------------------------------------
server {
    listen 443 ssl;
    server_name notes.local;

    ssl_certificate     /etc/nginx/lab1-certs/notes.local.crt;
    ssl_certificate_key /etc/nginx/lab1-certs/notes.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Локальная учебная настройка TLS.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/notes-lab-access.log;
    error_log  /var/log/nginx/notes-lab-error.log warn;

    # Фронтенд nginx отдаёт сам, Flask для него не используется.
    root /opt/notes-lab/frontend;
    index index.html;

    # Кастомные ошибки.
    error_page 404 /_errors/404.html;
    error_page 500 502 503 504 /_errors/50x.html;

    # Внутренний путь: напрямую /_errors/* пользователь открыть не сможет.
    location ^~ /_errors/ {
        internal;
        alias /opt/notes-lab/nginx/errors/;
    }

    # alias, а не root: /docs/ превращается в /opt/notes-lab/docs/.
    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        alias /opt/notes-lab/docs/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Basic Auth для административной статики.
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "Notes Service admin";
        auth_basic_user_file /etc/nginx/lab1-auth/notes.htpasswd;

        alias /opt/notes-lab/admin/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Все API-запросы идут в пул из двух Flask-инстансов.
    location ^~ /api/ {
        # nginx вернёт 429 вместо стандартного 503, если превышен rate limit.
        limit_req zone=notes_api_rate burst=2 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/proxy_params_lab1.conf;

        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # При недоступности первого upstream запрос отправляется второму.
        # non_idempotent добавлен для учебной демонстрации POST-failover.
        # В production POST желательно проектировать с idempotency key.
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        proxy_pass http://notes_backend_pool;
    }

    # В исходном Flask есть /health, но nginx проксирует его только по этому
    # явному маршруту, чтобы проверить состояние приложения через точку входа.
    location = /health {
        include /etc/nginx/snippets/proxy_params_lab1.conf;

        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        proxy_pass http://notes_backend_pool;
    }

    # Главная страница и остальные файлы фронтенда.
    location / {
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------
# 6) Второй изолированный virtual host
# ------------------------------------
server {
    listen 443 ssl;
    server_name second.local;

    ssl_certificate     /etc/nginx/lab1-certs/notes.local.crt;
    ssl_certificate_key /etc/nginx/lab1-certs/notes.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/second-lab-access.log;
    error_log  /var/log/nginx/second-lab-error.log warn;

    root /opt/notes-lab/other-site;
    index index.html;

    error_page 404 /_errors/404.html;

    location ^~ /_errors/ {
        internal;
        alias /opt/notes-lab/nginx/errors/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}